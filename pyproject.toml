[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jlogger"
version = "0.1.0"
description = "Fast structured JSON logger"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [
  {name = "kimnt93"}
]

keywords = ["logging", "json", "structured-logging", "zerolog", "zap"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/kimnt93/jlogger"
Repository = "https://github.com/kimnt93/jlogger"

# jlogger ships prebuilt native extensions in jlogger/ (built with maturin/cargo
# and committed to the repo), so installing from source or from a git URL needs
# NO Rust toolchain. If no committed .so matches the interpreter/platform, the
# package transparently falls back to a pure-Python JSON encoder.
[tool.setuptools]
packages = ["jlogger"]
include-package-data = true

[tool.setuptools.package-data]
jlogger = ["*.so", "*.pyd", "*.dylib", "py.typed"]

# NOTE: pip/uv use the setuptools backend above and never invoke maturin, so
# installing needs no Rust. The [tool.maturin] block below is only read by the
# `maturin` CLI (via `make native*`) to (re)build the committed .so files with
# the correct `jlogger/_native.*` layout.
[tool.maturin]
module-name = "jlogger._native"
python-source = "."
include = [{ path = "jlogger/py.typed", format = "wheel" }]
