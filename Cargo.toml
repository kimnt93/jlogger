[package]
name = "jlogger"
version = "0.1.0"
edition = "2021"
description = "Fast structured JSON logger for Python"
readme = "README.md"
repository = "https://github.com/kimnt93/jlogger"
homepage = "https://github.com/kimnt93/jlogger"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = []
abi3 = ["pyo3/abi3-py39"]

[dependencies]
pyo3 = "0.29.0"
serde_json = { version = "1", features = ["preserve_order"] }
